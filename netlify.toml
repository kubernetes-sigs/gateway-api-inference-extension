# netlify configuration
[build]
publish = "site"
command = "make build-docs-netlify"
# Python is installed on demand on the current (Ubuntu Noble) build image; 3.8 is EOL and no longer builds there.
# See https://docs.netlify.com/build/configure-builds/available-software-at-build-time/
environment = { PYTHON_VERSION = "3.12" }
